<ion-content>
  <form [formGroup]="shiftForm" (ngSubmit)="onSubmit()">
    <!-- Platform Dropdown -->
    <ion-item>
      <ion-label position="floating">Platform</ion-label>
      <ion-select formControlName="platform">
        <ion-select-option value="Platform1">Platform 1</ion-select-option>
        <ion-select-option value="Platform2">Platform 2</ion-select-option>
        <ion-select-option value="Platform3">Platform 3</ion-select-option>
      </ion-select>
    </ion-item>

    <!-- Platform Dropdown -->
    <ion-item>
      <ion-label position="floating">Locatie</ion-label>
      <ion-input type="text" formControlName="location"></ion-input>
    </ion-item>

    <!-- Date Picker -->
    <ion-item>
      <ion-label position="floating">Startdatum & uur</ion-label>
      <ion-datetime [preferWheel]="true" formControlName="startDate"></ion-datetime>
    </ion-item>

    <!-- End Time Picker -->
    <ion-item>
      <ion-label position="floating">Einduur</ion-label>
      <ion-datetime display-format="HH:mm" picker-format="HH:mm" formControlName="endDate"
        presentation="time"></ion-datetime>
    </ion-item>

    <!-- Break in Minutes -->
    <ion-item>
      <ion-label position="floating">Aantal minuten pauze</ion-label>
      <ion-input type="number" formControlName="break"></ion-input>
    </ion-item>

    <!-- Amount of Money Earned -->
    <ion-item>
      <ion-label position="floating">Verdienste</ion-label>
      <ion-input type="number" formControlName="earnings"></ion-input>
    </ion-item>

    <!-- Accepted Checkbox -->
    <ion-item>
      <ion-label position="floating">Geaccepteerd</ion-label>
      <ion-checkbox formControlName="accepted"></ion-checkbox>
    </ion-item>

    <!-- Submit Button -->
    <ion-button expand="full" type="submit" [disabled]="!shiftForm.valid">Voeg toe</ion-button>
  </form>
</ion-content>
