<div class="stats">
  <div class="filter">
    <h2>Periode:
      <span class="date-filter-btn" (click)="showBeginDatePicker = !showBeginDatePicker"> {{ startPeriod | date:'d/M/yy'
        }}</span> -
      <span class="date-filter-btn" (click)="showEndDatePicker = !showEndDatePicker"> {{ endPeriod | date:'d/M/yy' }}
      </span>
    </h2>
    <div *ngIf="showBeginDatePicker">
      <ion-label position="floating" class="label-datetime">Begin</ion-label>
      <ion-datetime presentation="date" [preferWheel]="true" [(ngModel)]="beginDatetime">
      </ion-datetime>
      <ion-button class="btn-begin" (click)="saveBeginPeriod()">Opslaan</ion-button>
    </div>
    <div *ngIf="showEndDatePicker">
      <ion-label position="floating" class="label-datetime">Einde</ion-label>
      <ion-datetime presentation="date" [preferWheel]="true" [(ngModel)]="endDatetime">
      </ion-datetime>
      <ion-button class="btn-end" (click)="saveEndPeriod()">Opslaan</ion-button>
    </div>
    <div class="btn-month">
      <ion-button class="btn-previous" (click)="goToPreviousMonth()">Vorige maand</ion-button>
      <ion-button (click)="goToNextMonth()">Volgende maand</ion-button>
    </div>
  </div>
  <p>Aantal shiften</p>
  <span class="statNumber">{{ countShifts }}</span>
  <p>Totaal uren</p>
  <span class="statNumber">{{ countHours }}</span>
  <p>Verdiend</p>
  <span class="statNumber">{{ earnings }}</span>
  <p>Verdiend (plus aangevraagd)</p>
  <span class="statNumber">{{ earningsPlusNA }}</span>
</div>
