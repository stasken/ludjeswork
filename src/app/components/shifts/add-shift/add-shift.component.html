<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Voeg shift toe
    </ion-title>
  </ion-toolbar>
</ion-header>
<ion-content>
  <form [formGroup]="shiftForm" (ngSubmit)="onSubmit()">
    <!-- Platform Dropdown -->
    <ion-item>
      <ion-label position="floating">Platform</ion-label>
      <ion-select formControlName="platform">
        <ion-select-option value="X-Care">X-Care</ion-select-option>
        <ion-select-option value="Caresquare">Caresquare</ion-select-option>
        <ion-select-option value="Clickcare">Clickcare</ion-select-option>
        <ion-select-option value="Beeple">Beeple</ion-select-option>
        <ion-select-option value="Zonder">Zonder platform</ion-select-option>
      </ion-select>
    </ion-item>

    <!-- Platform Dropdown -->
    <!-- <ion-item>
      <ion-label position="floating">Locatie</ion-label>
      <ion-input type="text" formControlName="location"></ion-input>
    </ion-item> -->

    <div class="location-item">
      <ion-item class="input-item animate simple_input" lines="none">
        <ion-label position="floating">Locatie</ion-label>
        <ion-input name="text" formControlName="location" class="ff text_color">
          <ion-button fill="clear" slot="end" aria-label="Show/hide" (click)="presentPopLocation()">
            <ion-icon name="caret-down-outline"></ion-icon>
          </ion-button>
        </ion-input>
      </ion-item>

      <div class="background_popover popover_size" *ngIf="isOpenPopLocation">
        <ion-item *ngFor="let item of filteredLocations; let i = index" class="item_popover">
          <ion-label (click)="locationSelected(item)">{{item}}</ion-label>
        </ion-item>
      </div>
    </div>

    <!-- Date Picker -->
    <!-- <ion-item>
      <ion-label position="floating">Startdatum & uur</ion-label>
      <ion-datetime [preferWheel]="true" formControlName="startDate"></ion-datetime>
    </ion-item> -->

    <!-- End Time Picker -->
    <!-- <ion-item>
      <ion-label position="floating">Einduur</ion-label>
      <ion-datetime display-format="HH:mm" picker-format="HH:mm" formControlName="endDate" presentation="time"></ion-datetime>
    </ion-item> -->

    <!-- START and END 2 -->
    <ion-item class="date-item">
      <ion-label position="floating">Startdatum</ion-label>
      <div class="datetime-input">
        <div class="date-input">
          <p class="date-filter-btn" (click)="showBeginDatePicker = !showBeginDatePicker"> {{ startDate | date:'d/M/yy'
            }}
          </p>
          <ion-datetime *ngIf="showBeginDatePicker" presentation="date" formControlName="startDate"></ion-datetime>
        </div>
        <div class="time-input">
          <ion-input type="number" formControlName="startHour"></ion-input>
          <p>:</p>
          <ion-input type="number" formControlName="startMinute"></ion-input>
        </div>
      </div>
    </ion-item>

    <ion-item class="date-item">
      <ion-label position="floating">Einddatum</ion-label>
      <div class="datetime-input">
        <!-- <div class="date-input">
          <p class="date-filter-btn" (click)="showEndDatePicker = !showEndDatePicker"> {{ endDate | date:'d/M/yy'
            }}
          </p>
          <ion-datetime *ngIf="showEndDatePicker" presentation="date" formControlName="endDate"></ion-datetime>
        </div> -->
        <div class="time-input">
          <ion-input type="number" formControlName="endHour"></ion-input>
          <p>:</p>
          <ion-input type="number" formControlName="endMinute"></ion-input>
        </div>
      </div>
    </ion-item>

    <!-- Break in Minutes -->
    <ion-item>
      <ion-label position="floating">Aantal minuten pauze</ion-label>
      <ion-input type="number" formControlName="break"></ion-input>
    </ion-item>

    <!-- Amount of Money Earned -->
    <ion-item *ngIf="selectedPlatform !== 'X-Care'">
      <ion-label position="floating">Verdienste</ion-label>
      <ion-input type="number" formControlName="earnings"></ion-input>
    </ion-item>
    <ion-item *ngIf="selectedPlatform === 'X-Care' && earningsNetto > 0">
      <ion-label style="color:white">Netto: {{ earningsNetto }}</ion-label>
    </ion-item>

    <!-- Accepted Checkbox -->
    <ion-item>
      <ion-label>Reeds geaccepteerd?</ion-label>
      <ion-checkbox formControlName="accepted"></ion-checkbox>
    </ion-item>

    <!-- Submit Button -->
    <ion-button class="btn-add" expand="full" type="submit" [disabled]="!shiftForm.valid">Voeg toe</ion-button>
  </form>
</ion-content>
